[package]
name = "petramond-mesh"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "CPU chunk meshing: greedy box-set meshing, face emission, AO, packed terrain vertices, and the mesh-side skylight sampling. No GPU types — the renderer uploads what this builds."

[features]
# Exposes test-only vertex decoders to dependent crates' test suites.
test-support = []

[dependencies]
petramond-math = { path = "../petramond-math" }
petramond-util = { path = "../petramond-util" }
petramond-world = { path = "../petramond-world" }
bytemuck = { version = "1.21", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
log = "0.4"
rustc-hash = "2"

[dev-dependencies]
petramond-world = { path = "../petramond-world", features = ["test-support"] }
petramond-worldgen = { path = "../petramond-worldgen" }
rayon = "1.10"
