[package]
name = "petramond-mesh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CPU chunk meshing: greedy box-set meshing, face emission, AO, packed terrain vertices, and the mesh-side skylight sampling. No GPU types — the renderer uploads what this builds."

[lints]
workspace = true

[features]
# Exposes test-only vertex decoders to dependent crates' test suites.
test-support = []

[dependencies]
petramond-math = { workspace = true }
petramond-util = { workspace = true }
petramond-world = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
petramond-world = { workspace = true, features = ["test-support"] }
petramond-worldgen = { workspace = true }
rayon = { workspace = true }
