[package]
name = "petramond-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Petramond client: app shell, client game session, native host, scene harness."

[lints]
workspace = true

[[bin]]
name = "petramond_native"
path = "src/bin/petramond_native.rs"

[[bin]]
name = "genmap"
path = "src/bin/genmap.rs"
required-features = ["tools"]

[features]
default = ["audio"]
# The genmap previewer (worldgen audits and previews).
tools = ["petramond/tools"]
# Client sound playback, forwarded to the audio engine in the core crate (the
# sound registry is always compiled there).
audio = ["petramond-audio/playback"]

[dependencies]
# The OS folder picker a player chooses a mod's export folder in (the desktop
# portal on Linux, the native dialog elsewhere).
rfd = { workspace = true }
petramond = { workspace = true }
petramond-audio = { workspace = true }
petramond-render = { workspace = true }
petramond-anim = { workspace = true }
petramond-math = { workspace = true }
petramond-util = { workspace = true }
petramond-world = { workspace = true }
petramond-input = { workspace = true }
petramond-mesh = { workspace = true }
petramond-worldgen = { workspace = true }
petramond-ui = { workspace = true }
petramond-text = { workspace = true }
mod-api = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
rustc-hash = { workspace = true }
smallvec = "1"
mimalloc = { workspace = true }
image = { workspace = true }

[build-dependencies]
# Embeds the desktop icon into the Windows executable.
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
petramond-anim = { workspace = true, features = ["test-support"] }
petramond-util = { workspace = true, features = ["test-support"] }
petramond-audio = { workspace = true, features = ["test-support"] }
env_logger = { workspace = true }
petramond = { workspace = true, features = ["test-support"] }
