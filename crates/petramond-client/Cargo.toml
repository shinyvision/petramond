[package]
name = "petramond-client"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Petramond client: app shell, client game session, native host, scene harness."

[[bin]]
name = "petramond_native"
path = "src/bin/petramond_native.rs"

[[bin]]
name = "genmap"
path = "src/bin/genmap.rs"

[features]
default = ["audio"]
# Client sound playback, forwarded to the audio engine in the core crate (the
# sound registry is always compiled there).
audio = ["petramond-audio/playback"]

[dependencies]
petramond = { path = "../.." }
petramond-audio = { path = "../petramond-audio", default-features = false }
petramond-render = { path = "../petramond-render" }
petramond-math = { path = "../petramond-math" }
petramond-util = { path = "../petramond-util" }
petramond-ui = { path = "../../petramond-ui" }
petramond-text = { path = "../../petramond-text" }
mod-api = { path = "../../mod-api" }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "0.30", features = ["rwh_06", "serde"] }
wgpu = "27"
pollster = "0.4"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
rustc-hash = "2"
mimalloc = "0.1.52"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
petramond-audio = { path = "../petramond-audio", default-features = false, features = ["test-support"] }
env_logger = "0.11"
petramond = { path = "../..", features = ["test-support"] }
