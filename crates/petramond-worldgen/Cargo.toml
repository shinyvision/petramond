[package]
name = "petramond-worldgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic worldgen pipeline: climate, terrain density, caves, features — plus the mod-gen hook seam and the column-gen cache records."

[lints]
workspace = true

[features]
# Dev tooling: the genmap audits, the feature previewer and the `genfeature`
# PNG bin. Off for the game and server builds, so they neither compile the
# tooling nor link `image`.
tools = ["dep:image"]

[dependencies]
petramond-math = { workspace = true }
petramond-persist = { workspace = true }
petramond-world = { workspace = true }
petramond-region = { workspace = true }
mod-api = { workspace = true }
log = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
# `float_roundtrip`: data recipes (density/terrain.json) carry computed f64
# knots that must parse back to the exact bits they were written from.
serde_json = { workspace = true, features = ["float_roundtrip"] }
image = { workspace = true, optional = true }

[[bin]]
name = "genfeature"
path = "src/bin/genfeature.rs"
required-features = ["tools"]

[[bin]]
name = "genparity"
path = "src/bin/genparity.rs"

[dev-dependencies]
petramond-world = { workspace = true, features = ["test-support"] }
