[package]
name = "petramond-math"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Foundation math and wire-format primitives: vectors, facings, single-byte wire enums."

[dependencies]
glam = { version = "0.29", features = ["bytemuck", "serde"] }
# Pure-Rust transcendentals, bit-identical on every target (see `detmath`).
libm = "0.2.16"
serde = { version = "1", features = ["derive"] }
