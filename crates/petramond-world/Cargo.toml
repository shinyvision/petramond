[package]
name = "petramond-world"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Deterministic world core: content registries, block/item domain, section storage, world data + behavior."

[dependencies]
petramond-math = { path = "../petramond-math" }
petramond-util = { path = "../petramond-util" }
mod-api = { path = "../../mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
directories = "5"
rustc-hash = "2"
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bincode = "1"
bytemuck = { version = "1.21", features = ["derive"] }

[features]
test-support = []
# Mirrors the engine crate: slow worldgen-adjacent tests are opt-in.
worldgen-tests = []

