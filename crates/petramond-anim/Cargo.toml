[package]
name = "petramond-anim"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Animator graphs over Blockbench rigs: expression language, local poses, mirroring and the graph runtime."

[dependencies]
petramond-world = { path = "../petramond-world" }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
rustc-hash = "2"
serde_json = "1"

[features]
# Exposes the hand-built test rig (`test_rig`) to dependent crates' test suites.
test-support = []
