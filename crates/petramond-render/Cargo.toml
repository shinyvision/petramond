[package]
name = "petramond-render"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Petramond wgpu renderer: pipelines, composed texture atlas, camera, render-input views."

[dependencies]
petramond = { path = "../.." }
petramond-math = { path = "../petramond-math" }
petramond-mesh = { path = "../petramond-mesh" }
petramond-util = { path = "../petramond-util" }
petramond-ui = { path = "../../petramond-ui" }
petramond-text = { path = "../../petramond-text" }
wgpu = "27"
winit = { version = "0.30", features = ["rwh_06", "serde"] }
bytemuck = { version = "1.21", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
pollster = "0.4"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
petramond-mesh = { path = "../petramond-mesh", features = ["test-support"] }
petramond = { path = "../..", features = ["test-support"] }
# Pack WGSL parse/validate tests (the same naga wgpu embeds): a shader typo
# fails `cargo test`, not the first windowed launch.
naga = { version = "27", default-features = false, features = ["wgsl-in"] }
