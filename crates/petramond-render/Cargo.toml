[package]
name = "petramond-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Petramond wgpu renderer: pipelines, composed texture atlas, camera, render-input views."

[lints]
workspace = true

[dependencies]
petramond = { workspace = true }
petramond-math = { workspace = true }
petramond-world = { workspace = true }
petramond-anim = { workspace = true }
mod-api = { workspace = true }
petramond-mesh = { workspace = true }
petramond-ui = { workspace = true }
petramond-text = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
smallvec = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
petramond-anim = { workspace = true, features = ["test-support"] }
petramond-mesh = { workspace = true, features = ["test-support"] }
petramond = { workspace = true, features = ["test-support"] }
# Pack WGSL parse/validate tests (the same naga wgpu embeds): a shader typo
# fails `cargo test`, not the first windowed launch.
naga = { workspace = true, features = ["wgsl-in"] }
