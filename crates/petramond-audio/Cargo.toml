[package]
name = "petramond-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Client-side sound playback engine (rodio) and the music catalog; the sound registry stays in the core crate."

[lints]
workspace = true

[features]
default = ["playback"]
# Sound PLAYBACK (rodio → cpal → ALSA on Linux). Off, `Audio` is a
# signature-identical silent stub and no audio system library is needed at
# build or run time.
playback = ["dep:rodio"]
# Exposes the played-sound probe to dependent crates' test suites.
test-support = []

[dependencies]
petramond-math = { workspace = true }
petramond-world = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis"], optional = true }
