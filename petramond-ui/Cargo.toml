[package]
name = "petramond-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Renderer-agnostic GUI runtime: documents, layout, theme, widgets, paint."

[lints]
workspace = true

[features]
# Software rasterizer for the DrawList (builder preview + headless tests).
raster = []

[dependencies]
petramond-text = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
bytemuck = { workspace = true }

# The demo needs the software rasterizer; without this gate any featureless
# workspace-wide build (`cargo test --workspace`) fails compiling the example.
[[example]]
name = "render_demo"
required-features = ["raster"]
