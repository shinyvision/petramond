# The mod source workspace: every crate here builds to a wasm32 core module
# installed into `mods/<id>/mod.wasm` by `make mods`. Deliberately separate
# from the engine workspace (different target, different profiles).
[workspace]
resolver = "2"
members = [
    "builder",
    "combat",
    "exploration",
    "farming",
    "forge",
    "furniture",
    "kitchen",
    "machine-core",
    "minimap",
    "monsters",
    "pack-check",
    "vehicles",
    "weather",
    "weather-core",
]

# Everything but `version` mirrors the root workspace's [workspace.package];
# scripts/audit-source.sh fails when they drift.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"

# Shared dependencies, declared once. An entry that the root workspace also
# declares must match it exactly (same version and features, same crate for a
# path), so guests and the engine agree on the types they share; the source
# audit checks this.
[workspace.dependencies]
mod-sdk = { path = "../mod-sdk" }
machine-core = { path = "machine-core" }
pack-check = { path = "pack-check" }
weather-core = { path = "weather-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identical to the root workspace's lint tables (checked by the source audit).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
too_many_arguments = "warn"

# Guests must abort (trap) on panic — the host treats a trap as "disable the
# mod for this session, keep ticking". Speed over size: bundled mod wasm runs
# raster/codec hot loops on the frame, and the size delta is a few hundred KB.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The iteration guest build (`make mods`, `make mod`; install-mods.sh's
# default): same abort/strip
# contract as release, but no LTO and parallel codegen so each mod links in a
# fraction of the fat-LTO time. Release packaging
# (`make mods MOD_PROFILE=release`) keeps the profile above.
[profile.wasm-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true

# The guests the test suite stages (scripts/install-mods.sh --profile
# wasm-test): release's opt-level, panic=abort and SIMD, minus the fat LTO and
# single codegen unit that dominate a guest build — a mod-sdk or mod change
# must not cost every test run a shipping build. Shipped guests (release
# packaging) stay on `release`.
[profile.wasm-test]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.fasttest]
inherits = "dev"
opt-level = 1

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
