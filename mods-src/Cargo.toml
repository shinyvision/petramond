# The mod source workspace: every crate here builds to a wasm32 core module
# installed into `mods/<id>/mod.wasm` by `make mods`. Deliberately separate
# from the engine workspace (different target, different profiles).
[workspace]
resolver = "2"
members = [
    "builder",
    "combat",
    "exploration",
    "farming",
    "forge",
    "furniture",
    "kitchen",
    "machine-core",
    "minimap",
    "monsters",
    "pack-check",
    "vehicles",
    "weather",
    "weather-core",
]

# Shared manifest metadata: every member inherits these with `.workspace = true`
# so a new mod starts from the same version/edition/license.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# One declaration per shared dependency; members opt in with
# `name.workspace = true` (plus any extra features they need).
[workspace.dependencies]
mod-sdk = { path = "../mod-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
machine-core = { path = "machine-core" }
pack-check = { path = "pack-check" }
weather-core = { path = "weather-core" }

# Guests must abort (trap) on panic — the host treats a trap as "disable the
# mod for this session, keep ticking". Speed over size: bundled mod wasm runs
# raster/codec hot loops on the frame, and the size delta is a few hundred KB.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The iteration guest build (`make mods`, `make mod`, the test suite's staged
# packs): same abort/strip contract as release, but no LTO and parallel
# codegen so each mod links in a fraction of the fat-LTO time. Release
# packaging (`make mods MOD_PROFILE=release`) keeps the profile above.
[profile.wasm-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true

[profile.fasttest]
inherits = "dev"
opt-level = 1

[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
