# Core wasm SIMD128 for every guest build: the engine's wasmtime runs the
# core SIMD proposal (deterministic — only relaxed-SIMD is disabled), and
# LLVM autovectorizes the raster/codec loops with it. The engine-side test
# src/modding/tests/guest_features.rs asserts this flag and that the engine
# config in src/modding/host/mod.rs accepts it (and refuses relaxed SIMD).
[target.wasm32-unknown-unknown]
rustflags = ["-Ctarget-feature=+simd128"]

# Build into the root workspace's target dir, so a plain `cargo test` in here
# reuses the engine-side crates already compiled there.
[build]
target-dir = "../target"
