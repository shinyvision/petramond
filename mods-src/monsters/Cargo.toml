[package]
name = "monsters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hostile-monster mod: light-based zombie and hushjaw spawning, sunburn, data-driven mob sounds, and skeleton camps manned by armed skeleton guards."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
mod-sdk = { workspace = true }
serde = { workspace = true }
# The shared field crate only — NOT a dependency on the weather mod. The field
# row arrives on its session channel (`feed`); without a weather mod nothing is
# heard, the sky is clear, and sunburn behaves exactly as it does standalone.
weather-core = { workspace = true, features = ["sdk"] }

[dev-dependencies]
pack-check = { workspace = true }
