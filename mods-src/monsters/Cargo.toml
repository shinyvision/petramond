[package]
name = "monsters"
version = "0.1.0"
edition = "2021"
description = "Hostile-monster mod: light-based zombie spawning driven by petramond time, sunburn, data-driven mob sounds, and chase + melee combat."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
mod-sdk = { path = "../../mod-sdk" }
# The shared field crate only — NOT a dependency on the weather mod. The field
# row arrives on its session channel (`feed`); without a weather mod nothing is
# heard, the sky is clear, and sunburn behaves exactly as it does standalone.
weather-core = { path = "../weather-core", features = ["sdk"] }

[dev-dependencies]
pack-check = { path = "../pack-check" }
