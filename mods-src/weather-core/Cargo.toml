[package]
name = "weather-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared closed-form weather field: periodic wind-advected coverage noise evaluated identically by the weather mod's server and client sides. clouds.wgsl in the weather pack is this crate's visual twin."

[lints]
workspace = true

[dependencies]
# Only for the `sdk` feature's publish/subscribe channel (`feed`); the field
# math itself stays dependency-free.
mod-sdk = { workspace = true, optional = true }

[features]
sdk = ["dep:mod-sdk"]
