[package]
name = "exploration"
version = "0.1.0"
edition = "2021"
description = "Underground habitats, mineral deposits and exploration equipment."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
mod-sdk = { path = "../../mod-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petramond-math = { path = "../../crates/petramond-math" }
