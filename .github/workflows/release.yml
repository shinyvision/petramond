name: Release

# Builds ready-to-play bundles for all supported platforms and, on a version
# tag, publishes them as a GitHub Release.
#
#   - Push a tag `vX.Y.Z`        -> builds + creates/updates the release.
#   - Run manually (Actions tab) -> builds + uploads the bundles as run
#                                    artifacts (no release), for testing.
#
# Each bundle is the native binary plus the `assets/` and `mods/` folders next
# to it; the game resolves both relative to the executable (see the `assets`
# module in the petramond-world crate), so a player just unzips and
# double-clicks. Beyond that, each platform gets its desktop integration:
#
#   - macOS: the bundle is `Petramond.app` (assets and mods in
#     Contents/Resources), ad-hoc signed. There is no Apple developer account,
#     so it is not notarized; petramond.com/install-mac.sh installs it from
#     the terminal, which skips the Gatekeeper prompt a browser download gets.
#   - Windows: the zip, plus an Inno Setup installer (`-setup.exe`) that adds
#     Start menu and desktop shortcuts. The .exe carries its icon either way.
#   - Linux: the tarball carries `install.sh`, which adds a menu entry and
#     icon for the current user on any freedesktop desktop.
#
# Nothing is built until the full CI workflow (every gate, Linux tests plus the
# Windows and macOS portability tests) has passed for this exact commit. Every
# job uses the toolchain pinned in rust-toolchain.toml and builds `--locked`,
# so a release links the dependency versions CI tested.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Sample mods compile to wasm32, which is architecture-independent, so build
  # them once here and hand the exact same bytes to every platform bundle. This
  # also avoids needing `make` on the Windows runners.
  mods:
    name: Build sample mods (wasm)
    needs: ci
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-mods
          cache-workspaces: mods-src -> ../target
          save-cache: true

      - name: Build and stage bundled mods
        run: CARGO_CMD="cargo --locked" bash scripts/install-mods.sh --profile release staged-mods

      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: staged-mods
          if-no-files-found: error

  build:
    name: Build ${{ matrix.id }}
    needs: [ci, mods]
    runs-on: ${{ matrix.runner }}
    env:
      # Shipped binaries target each architecture's BASELINE CPU, the same on
      # every platform. A higher x86-64 level (v3: AVX2/FMA/BMI2) would crash
      # with SIGILL on older CPUs at launch, before any feature check could
      # run; adopting one needs a baseline launcher that checks the CPU first.
      # Set empty on purpose: RUSTFLAGS overrides any rustflags a cargo config
      # file could contribute.
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          # `server: true` also builds the headless dedicated server into this
          # bundle. It is a matrix flag rather than a platform test because
          # which platforms want one is a packaging decision, not a property
          # of the code — every target can build it.
          - id: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            server: true
          - id: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - id: windows-amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - id: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - id: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # cpal/rodio link against ALSA at build time on Linux (the packages are
      # installed on Linux runners only).
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-${{ matrix.id }}
          save-cache: true
          targets: ${{ matrix.target }}
          apt-packages: libasound2-dev

      # `petramond_native` belongs to the `petramond-client` crate, not the
      # workspace root package, so it must be named with `-p`: a bare
      # `--bin` resolves only against the default-run packages and fails with
      # "no bin target named petramond_native". The binary still lands in the
      # shared workspace target dir that the staging step below copies from.
      - name: Build
        shell: bash
        run: cargo build --locked --release -p petramond-client --bin petramond_native --target ${{ matrix.target }}

      # The headless server is the ENGINE crate's own bin, and its tree has no
      # wgpu/winit/rodio at all — so it needs no GPU, no display and no ALSA on
      # the box that runs it. Built separately rather than as a second `--bin`
      # so a server-only bundle stays one flag away.
      - name: Build headless server
        if: matrix.server
        shell: bash
        run: cargo build --locked --release -p petramond --bin petramond_server --target ${{ matrix.target }}

      # The GUI builder finds the game's assets at run time (the nearest
      # `assets/` above the executable, or `--assets`), so the same bundle
      # layout serves it: mod authors preview their pack documents against the
      # shipped theme without a source checkout.
      - name: Build GUI builder
        shell: bash
        run: cargo build --locked --release -p gui-builder --bin gui-builder --target ${{ matrix.target }}

      - name: Download bundled mods
        uses: actions/download-artifact@v4
        with:
          name: mods
          path: staged-mods

      - name: Stage bundle
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          PKG="petramond-${VERSION}-${{ matrix.id }}"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"

          # Programs go in BIN, game data in DATA. They are the same folder
          # everywhere except inside a macOS app bundle.
          DEST="stage/$PKG"
          case "${{ matrix.id }}" in
            macos-*)
              APP="$DEST/Petramond.app"
              BIN="$APP/Contents/MacOS"
              DATA="$APP/Contents/Resources"
              ;;
            *)
              BIN="$DEST"
              DATA="$DEST"
              ;;
          esac
          mkdir -p "$BIN" "$DATA/mods"
          cp "target/${{ matrix.target }}/release/petramond_native${EXT}" "$BIN/petramond${EXT}"
          cp "target/${{ matrix.target }}/release/gui-builder${EXT}" "$BIN/gui-builder${EXT}"
          if [ "${{ matrix.server }}" = "true" ]; then
            cp "target/${{ matrix.target }}/release/petramond_server${EXT}" \
               "$BIN/petramond-server${EXT}"
          fi
          cp -r assets "$DATA/assets"
          # Every staged pack ships; the list lives in the mods job, not here.
          cp -r staged-mods/. "$DATA/mods/"

          case "${{ matrix.id }}" in
            macos-*)
              # CFBundleShortVersionString must be plain numbers: v0.5.0-rc1 -> 0.5.0.
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                BUNDLE_VERSION="${VERSION#v}"
                BUNDLE_VERSION="${BUNDLE_VERSION%%-*}"
              else
                BUNDLE_VERSION="0.0.0"
              fi
              sed "s/@VERSION@/$BUNDLE_VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
              cp packaging/icons/petramond.icns "$DATA/petramond.icns"
              # Stray extended attributes break the signature seal. An ad-hoc
              # signature needs no Apple account; it turns "damaged" into the
              # ordinary unidentified-developer prompt on a browser download.
              xattr -cr "$APP"
              codesign --force --sign - "$BIN/gui-builder"
              codesign --force --sign - "$APP"
              codesign --verify --deep --strict "$APP"
              ;;
            linux-*)
              cp packaging/linux/install.sh "$DEST/install.sh"
              chmod +x "$DEST/install.sh"
              mkdir -p "$DEST/icons"
              for size in 16 32 48 64 128 256 512; do
                cp "packaging/icons/petramond-$size.png" "$DEST/icons/"
              done
              ;;
          esac

          BUNDLED=""
          for d in staged-mods/*/; do
            n="$(basename "$d")"
            BUNDLED="${BUNDLED:+$BUNDLED, }$n"
          done

          README="$DEST/README.txt"
          {
            echo "Petramond"
            echo "========="
            echo
            echo "A voxel sandbox about wild landscapes, player-built homes, and"
            echo "worlds that can grow through mods."
            echo
            echo "HOW TO RUN"
          } > "$README"

          case "${{ matrix.id }}" in
            windows-*)
              {
                echo "  Double-click petramond.exe."
                echo
                echo "  Prefer Start menu and desktop shortcuts? Download the"
                echo "  petramond-...-setup.exe installer from the same release instead."
                echo
                echo "  Windows may show a blue \"Windows protected your PC\" box because"
                echo "  this build is not code-signed. Click \"More info\", then \"Run anyway\"."
              } >> "$README"
              ;;
            macos-*)
              {
                echo "  The easiest way: open Terminal and paste this line. It installs"
                echo "  the newest version into Applications without any security prompt:"
                echo "    curl -fsSL https://petramond.com/install-mac.sh | sh"
                echo "  Run the same line again later to update."
                echo
                echo "  Installing from this download instead:"
                echo "    1. Drag Petramond.app into your Applications folder."
                echo "    2. Double-click it. macOS says it can't verify the app, because"
                echo "       this build isn't signed with an Apple developer account."
                echo "       Click Done."
                echo "    3. Open System Settings > Privacy & Security, scroll down, and"
                echo "       click \"Open Anyway\" next to the message about Petramond."
                echo "       Confirm with your password. You only do this once."
                echo
                echo "  Needs a Mac with Apple silicon (M1 or newer)."
              } >> "$README"
              ;;
            linux-*)
              {
                echo "  Run ./install.sh from a terminal in this folder. It adds"
                echo "  Petramond to your applications menu (just for you, no root"
                echo "  needed). Run it again from a newer download to update, or run"
                echo "  ~/.local/share/petramond-game/install.sh --uninstall to remove it."
                echo
                echo "  You can also skip installing and run ./petramond from this folder."
                echo
                echo "  Needs a Vulkan-capable GPU and driver."
              } >> "$README"
              ;;
          esac

          if [ "${{ matrix.server }}" = "true" ]; then
            {
              echo
              echo "DEDICATED SERVER"
              echo "  petramond-server runs a world headlessly for other players to"
              echo "  join. It needs no GPU, no display and no audio libraries."
              echo
              echo "    ./petramond-server <world-name>"
              echo
              echo "  The world name is the only argument; everything else is an"
              echo "  environment variable:"
              echo "    PETRAMOND_PORT=<port>   listen port (default 7434)"
              echo "    PETRAMOND_RD=<4..64>    streaming radius for this run"
              echo "    PETRAMOND_SEED=<u32>    seed, used only when creating the world"
              echo
              echo "  Console commands: stop (saves and exits), save, say, op, deop,"
              echo "  time. Player chat is logged here too."
              echo
              echo "  It writes a settings.json next to itself on first run; that is"
              echo "  where the server's view-distance ceiling lives. The world itself"
              echo "  is saved in your user data folder, like the game's."
              echo
              echo "  With nobody connected the simulation pauses, so an idle server"
              echo "  costs almost nothing."
            } >> "$README"
          fi

          {
            echo
            echo "GUI BUILDER"
            echo "  gui-builder edits and previews the game's GUI documents with the"
            echo "  game's own renderer. It reads the game's \"assets\" folder;"
            echo "  to preview a mod's documents, open a project saved inside the"
            echo "  mod's pack folder or pass --pack <pack folder>. See --help."
            case "${{ matrix.id }}" in
              macos-*)
                echo "  On macOS it lives inside the app. Run it from Terminal:"
                echo "    /Applications/Petramond.app/Contents/MacOS/gui-builder"
                ;;
            esac
          } >> "$README"

          {
            echo
            case "${{ matrix.id }}" in
              macos-*) ;;
              *)
                echo "IMPORTANT"
                echo "  Keep the \"assets\" and \"mods\" folders next to the program you"
                echo "  run. Both are loaded from there."
                echo
                ;;
            esac
            echo "MODS"
            echo "  Bundled: ${BUNDLED}."
            echo "  Mods you install from the in-game content library go to your user"
            echo "  data folder. A server must have the same mods as the players"
            echo "  joining it."
            echo
            echo "SAVES"
            echo "  Worlds and settings are stored in your user data folder, not"
            echo "  here, so you can move or replace this folder safely."
            echo
            echo "CONTROLS"
            echo "  WASD move, mouse look, scroll to pick a hotbar slot."
            echo "  Left click mine/attack, right click place/use/open."
            echo "  Space jump, Shift sneak, Ctrl sprint."
            echo "  E inventory, 1-9 hotbar, Q drop, R rotate block, V perspective,"
            echo "  Esc close/pause."
          } >> "$README"

      # COPYFILE_DISABLE keeps macOS tar from adding `._*` metadata files,
      # which would land inside the signed app bundle and break its seal.
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          COPYFILE_DISABLE=1 tar -C stage -czf "${PKG}.tar.gz" "$PKG"
          echo "ASSET=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "stage/$env:PKG" -DestinationPath "$env:PKG.zip"
          "ASSET=$env:PKG.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The installer ships next to the zip. The website's download button
      # offers `<pkg>-setup.exe` over the zip, so keep that name.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Invoke-WebRequest "https://jrsoftware.org/download.php/is.exe" -OutFile "$env:RUNNER_TEMP\is.exe"
            Start-Process "$env:RUNNER_TEMP\is.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$env:RUNNER_TEMP\inno"
            $iscc = "$env:RUNNER_TEMP\inno\ISCC.exe"
          }
          $arch = if ("${{ matrix.id }}" -eq "windows-arm64") { "arm64" } else { "x64compatible" }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          $source = (Resolve-Path "stage/$env:PKG").Path
          $output = "$env:PKG-setup"
          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputBase=$output" "/DArch=$arch" "/O$PWD" packaging\windows\petramond.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "INSTALLER=$output.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.id }}
          path: |
            ${{ env.ASSET }}
            ${{ env.INSTALLER }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease";; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Petramond $TAG" \
              --generate-notes \
              $PRERELEASE
          fi
