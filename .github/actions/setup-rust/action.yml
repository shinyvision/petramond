name: Set up Rust
description: >
  Installs the toolchain pinned in rust-toolchain.toml (never a floating
  channel), optional extra targets and Linux packages, and a per-job cargo
  cache. Every CI and release job goes through this, so a new job (a
  determinism gate, another platform) is one `uses:` away.

inputs:
  cache-key:
    description: Distinguishes this job's cache from other jobs' (matrix jobs need one per entry).
    required: true
  cache-workspaces:
    description: Swatinem/rust-cache `workspaces` (manifest dir -> target dir, one per line).
    required: false
    default: ". -> target"
  save-cache:
    description: Whether this run may write the cache. Defaults to main-branch runs only, so pull requests restore main's caches without evicting them.
    required: false
    default: ${{ github.ref == 'refs/heads/main' }}
  targets:
    description: Extra rustc targets, space-separated (the toolchain file already adds wasm32-unknown-unknown).
    required: false
    default: ""
  apt-packages:
    description: Ubuntu packages to install on Linux runners.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux packages
      if: runner.os == 'Linux' && inputs.apt-packages != ''
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes ${{ inputs.apt-packages }}

    # Every hosted image ships rustup except, possibly, the newer ARM ones.
    - name: Install rustup
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi

    # rustup reads rust-toolchain.toml (channel, components, targets). rustup
    # 1.28+ installs it with an argument-less `toolchain install`; older
    # versions reject that and install it on `rustup show` instead.
    - name: Install pinned toolchain
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        if ! rustup toolchain install; then
          rustup show
        fi
        rustc --version
        cargo --version

    - name: Add targets
      if: inputs.targets != ''
      shell: bash
      run: rustup target add ${{ inputs.targets }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.cache-workspaces }}
        save-if: ${{ inputs.save-cache }}
