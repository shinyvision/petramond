[package]
name = "petramond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["rachel"]
description = "A noise-based voxel world biomes + features."

[lints]
workspace = true

[workspace]
members = [
    ".",
    "mod-api",
    "mod-sdk",
    "petramond-text",
    "petramond-ui",
    "gui-builder",
    "crates/petramond-math",
    "crates/petramond-util",
    "crates/petramond-persist",
    "crates/petramond-worldgen",
    "crates/petramond-mesh",
    "crates/petramond-world",
    "crates/petramond-input",
    "crates/petramond-anim",
    "crates/petramond-region",
    "crates/petramond-client",
    "crates/petramond-audio",
    "crates/petramond-render",
]
# One lockfile and one set of profiles for the game, the GUI builder and the
# guest SDK, so the builder's preview links exactly the petramond-ui, image and
# serde the game does. A plain `cargo build`/`cargo run` at the root still
# builds only the `petramond` package (a root package is the implicit default
# member); the builder and the SDK are selected with `-p` or `--workspace`.
# mods-src stays its own wasm32 workspace (another target, its own release
# profile) built by `make mods`; scripts/audit-source.sh keeps its shared
# dependency and lint tables identical to the ones below.
exclude = ["mods-src"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
# The toolchain rust-toolchain.toml pins; raise the two together.
rust-version = "1.97"
license = "MIT"

# Every dependency more than one member uses, declared once. Members write
# `dep = { workspace = true }` and can only ADD features to an entry (default
# features included), so each entry carries the smallest feature set any
# member needs.
[workspace.dependencies]
# Internal crates.
petramond = { path = "." }
mod-api = { path = "mod-api" }
mod-sdk = { path = "mod-sdk" }
petramond-text = { path = "petramond-text" }
petramond-ui = { path = "petramond-ui" }
petramond-math = { path = "crates/petramond-math" }
petramond-util = { path = "crates/petramond-util" }
petramond-persist = { path = "crates/petramond-persist" }
petramond-worldgen = { path = "crates/petramond-worldgen" }
petramond-mesh = { path = "crates/petramond-mesh" }
petramond-world = { path = "crates/petramond-world" }
petramond-input = { path = "crates/petramond-input" }
petramond-anim = { path = "crates/petramond-anim" }
petramond-region = { path = "crates/petramond-region" }
petramond-render = { path = "crates/petramond-render" }
# Playback is the client's choice (its `audio` feature forwards to
# `petramond-audio/playback`), so the audio crate's default is off here.
petramond-audio = { path = "crates/petramond-audio", default-features = false }

# External crates.
bincode = "1"
bytemuck = { version = "1.21", features = ["derive"] }
directories = "5"
env_logger = "0.11"
flate2 = "1"
glam = { version = "0.29", features = ["bytemuck", "serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
mimalloc = "0.1.52"
pollster = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rayon = "1.10"
# Fast fixed-seed hasher for the per-voxel hot maps (world sections, A* scratch,
# tick/mesh sets) — std's SipHash is a keyed cryptographic hash and its cost
# shows up in collision/water/pathing loops that hit these maps per cell.
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WASM runtime for mod logic. Deliberately minimal features: core modules only —
# no wasi, no component model, no async, no gc, no wat parsing, no parallel
# compilation — to keep compile time and binary size down.
wasmtime = { version = "46", default-features = false, features = ["cranelift", "runtime", "parallel-compilation"] }
# The graphics stack moves as one: naga is the shader compiler wgpu embeds (the
# same major version), and winit is the windowing version wgpu's surfaces take.
wgpu = "27"
naga = { version = "27", default-features = false }
winit = { version = "0.30", features = ["rwh_06", "serde"] }

# Lint policy for every member (`[lints] workspace = true`), so `cargo clippy`
# in an editor reports what CI does; CI adds `-D warnings` on top. mods-src
# mirrors this table.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Debugging leftovers never ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# A wide positional signature is a refactoring signal: group the arguments into
# a context struct. The remaining exceptions are allowed item by item, never
# crate-wide, so each one stays visible (scripts/audit-source.sh rejects
# crate- and module-level `#![allow(...)]`).
too_many_arguments = "warn"

[lib]
crate-type = ["rlib"]

[features]
default = []
# Exposes the in-process test harness (inline pools, world fixtures, the
# WAT-built unit guest — hence wasmtime/wat) to dependent crates' test suites.
test-support = ["wasmtime/wat", "petramond-world/test-support"]
# Worldgen dev tooling re-exported through `tooling::worldgen` (genmap).
tools = ["petramond-worldgen/tools"]

# Headless dedicated server: the same ServerGame/loop the in-game
# "Open to LAN" runs, with no local session and no renderer.
[[bin]]
name = "petramond_server"
path = "src/bin/server.rs"

# The content library's build and install side (`make addons`): pack, check
# and stage an addon or mod archive, with no GPU.
[[bin]]
name = "petramond_content"
path = "src/bin/content.rs"

[dependencies]
# Renderer-agnostic GUI runtime (documents, layout, theme, widgets, paint) —
# shared with the gui-builder so its preview is pixel-exactly the game's UI.
petramond-ui = { workspace = true }
petramond-text = { workspace = true }
petramond-math = { workspace = true }
petramond-util = { workspace = true }
petramond-persist = { workspace = true }
petramond-worldgen = { workspace = true }
petramond-mesh = { workspace = true }
petramond-world = { workspace = true }
petramond-input = { workspace = true }
petramond-anim = { workspace = true }
petramond-region = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
noise = { version = "0.9", default-features = false }
image = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
env_logger = { workspace = true }
directories = { workspace = true }
flate2 = { workspace = true }
crc32fast = "1"
# Content addressing for world-owned schematic assets.
blake3 = "1"
# Player identity: clients hold an ed25519 keypair and sign the server's
# per-connection join challenge; saves and operator rights key on the public key.
ed25519-dalek = "2"
# OS randomness for identity keys, join challenges and the per-run server id a
# join ticket is minted against.
getrandom = { version = "0.2", features = ["std"] }
# The content library checks downloads against the SHA-256 petramond.com
# publishes for them.
sha2 = "0.10"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
bincode = { workspace = true }
mimalloc = { workspace = true }
rustc-hash = { workspace = true }
# Per-thread scheduling priority (setpriority/gettid) for background worker pools.
libc = "0.2"
# The local UTC offset of the client wall clock, and HTTP dates (std has no time zones).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
# --- Modding host (Phase 2b) ---
# Shared engine↔mod ABI types (postcard enums).
mod-api = { workspace = true }
postcard = { workspace = true }
wasmtime = { workspace = true }
# Blocking HTTPS for the Petramond account service (sign-in, token rotation,
# join-ticket verification). Deliberately minimal: rustls only — no tokio, no
# native-tls, no cookies, no proxy support. Calls run on their own worker
# threads; nothing on the tick path or the render path speaks HTTP.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
petramond-world = { workspace = true, features = ["test-support"] }
petramond-util = { workspace = true, features = ["test-support"] }
# Tests hand-build hostile guest modules from WAT text (trap/registration-window
# contracts); the shipped binary never parses wat.
wasmtime = { workspace = true, features = ["wat"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Day-to-day playtest profile (`make run`): release-grade opt-level but with
# incremental compilation, parallel codegen units and no LTO, so a one-file
# change rebuilds in seconds instead of recompiling the whole crate as one LTO
# unit (~48s measured). CGU count / LTO do not change float semantics (genparity
# COMBINED verified identical to release); keep `release` for shipped builds.
[profile.playtest]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = false

[profile.dev]
opt-level = 1

# Bare `cargo test` keeps the light optimization used by day-to-day debug
# builds while retaining the checks that catch invalid indexing and arithmetic.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

# The suite's profile (`make test`): playtest codegen for speed, plus the checks
# release turns off. Its own output dir keeps the many package/feature
# combinations test runs resolve out of target/playtest, so
# `cargo clean --profile fasttest` never costs a game rebuild.
[profile.fasttest]
inherits = "playtest"
debug-assertions = true
overflow-checks = true
